<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>同学会</title>
  <style>
    html, body { margin: 0; height: 100%; background: #9fbfe0; overflow: hidden; overscroll-behavior: none;
                 font: 16px system-ui, -apple-system, "PingFang SC", sans-serif; }
    /* Every finger gesture goes to the game, none to the browser
       (no page scrolling, pinch-zooming, text selection or long-press menu). */
    #bevy { display: block; width: 100%; height: 100%; outline: none; touch-action: none;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
               color: #123; pointer-events: none; line-height: 1.8; }
  </style>
</head>
<body>
  <canvas id="bevy" tabindex="0"></canvas>
  <div id="loading">同学会<br>正在载入（第一次约 40 MB）……</div>
  <script type="module">
    import init from "./reunion.js";
    const canvas = document.getElementById("bevy");
    canvas.addEventListener("pointerdown", () => canvas.focus());
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    // iOS Safari still pinch-zooms the page on its own "gesture" events.
    for (const ev of ["gesturestart", "gesturechange", "gestureend"]) {
      document.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
    }

    // Reading lines aloud. The game asks with a macOS voice name; the
    // browser has its own Chinese voices, so a matching name is used if
    // there is one, otherwise each name gets its own voice and pitch.
    const synth = window.speechSynthesis;
    const chinese = () => (synth ? synth.getVoices() : []).filter((v) => /^zh[-_](CN|Hans)/i.test(v.lang));
    const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
    window.reunionSpeak = (text, voice) => {
      if (!synth) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      const voices = chinese();
      const first = voice.split(" ")[0].toLowerCase();
      const named = voices.find((v) => v.name.toLowerCase().replace("-", "").startsWith(first));
      const h = hash(voice);
      u.voice = named || voices[h % Math.max(voices.length, 1)] || null;
      if (!named) u.pitch = 0.85 + (h % 5) * 0.1;
      synth.speak(u);
    };
    // iOS only lets a page speak after speaking once inside a tap.
    const unlock = () => {
      if (synth) synth.speak(new SpeechSynthesisUtterance(""));
      for (const ev of ["touchend", "click", "keydown"]) document.removeEventListener(ev, unlock);
    };
    for (const ev of ["touchend", "click", "keydown"]) document.addEventListener(ev, unlock);

    init().catch((e) => {
      // Bevy ends its event loop by throwing; anything else is a real error.
      if (!String(e).includes("Using exceptions for control flow")) {
        document.getElementById("loading").textContent = "启动失败：" + e;
        throw e;
      }
    });
    const done = () => document.getElementById("loading")?.remove();
    new MutationObserver(done).observe(canvas, { attributes: true, attributeFilter: ["width", "height"] });
  </script>
</body>
</html>
